<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".8">
      <stop offset="0" stop-color="#fff6e4" />
      <stop offset="1" stop-color="#e6cba1" />
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c46f" />
      <stop offset="1" stop-color="#bd7a24" />
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d78f" />
      <stop offset="1" stop-color="#cd8b30" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" />
  <ellipse cx="200" cy="308" rx="144" ry="26" fill="#a97c46" opacity=".3" />

  <!-- risol belakang kiri -->
  <g stroke="#8a5220" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(-16 118 226)">
      <path d="M62 226c0-14 10-24 24-24h64c14 0 24 10 24 24s-10 24-24 24H86c-14 0-24-10-24-24z" fill="url(#skin2)" />
      <path d="M40 226c0-14 10-24 24-24 14 0 24 10 24 24s-10 24-24 24c-14 0-24-10-24-24z" fill="#f7dfae" />
      <path d="M46 210c8 4 12 10 12 16s-4 12-12 16" fill="none" stroke="#c69a5c" stroke-width="4" />
    </g>
  </g>

  <!-- risol belakang kanan -->
  <g stroke="#8a5220" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(14 288 200)">
      <path d="M232 200c0-14 10-24 24-24h60c14 0 24 10 24 24s-10 24-24 24h-60c-14 0-24-10-24-24z" fill="url(#skin)" />
      <path d="M212 200c0-14 10-24 24-24s24 10 24 24-10 24-24 24-24-10-24-24z" fill="#f7dfae" />
      <path d="M218 184c8 4 12 10 12 16s-4 12-12 16" fill="none" stroke="#c69a5c" stroke-width="4" />
    </g>
  </g>

  <!-- risol depan, terbelah memperlihatkan isi -->
  <g stroke="#8a5220" stroke-width="5" stroke-linejoin="round">
    <g transform="rotate(-6 196 268)">
      <path d="M104 268c0-18 12-30 30-30h124c18 0 30 12 30 30s-12 30-30 30H134c-18 0-30-12-30-30z" fill="url(#skin)" />
      <!-- isi -->
      <path d="M104 268c0-18 12-30 30-30h14v60h-14c-18 0-30-12-30-30z" fill="#f7dfae" />
      <g fill="#a1652c" stroke-width="4">
        <path d="M120 246c8-3 14 2 13 8-1 7-10 8-14 2-3-4-2-8 1-10z" />
        <path d="M120 282c8-3 14 2 13 8-1 7-10 8-14 2-3-4-2-8 1-10z" />
      </g>
      <g fill="#7cb342" stroke="#4c8b3a" stroke-width="3">
        <path d="M112 262h20v12h-20z" />
      </g>
    </g>
