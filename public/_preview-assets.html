<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f4f1e6;
        font-family: sans-serif;
        display: grid;
        grid-template-columns: repeat(4, 200px);
        gap: 16px;
      }
      figure {
        margin: 0;
        text-align: center;
      }
      img {
        width: 200px;
        height: 200px;
        border-radius: 50%;
        border: 6px solid #a86f3a;
        box-sizing: border-box;
        background: #fff;
      }
      figcaption {
        font-size: 12px;
        padding-top: 6px;
        color: #3a2e22;
      }
      .wide img {
        width: 400px;
        height: 260px;
        border-radius: 12px;
        border: 2px solid #a86f3a;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <figure><img src="/uploads/products/samyang-roll.svg" /><figcaption>samyang-roll</figcaption></figure>
    <figure><img src="/uploads/products/nasi-ayam-geprek.svg" /><figcaption>nasi-ayam-geprek</figcaption></figure>
    <figure><img src="/uploads/products/es-jelly-lumut-coklat.svg" /><figcaption>es-jelly-lumut</figcaption></figure>
    <figure><img src="/uploads/products/brownies-coklat.svg" /><figcaption>brownies</figcaption></figure>
    <figure><img src="/uploads/products/roti-gulung-sosis.svg" /><figcaption>roti-gulung-sosis</figcaption></figure>
    <figure><img src="/uploads/products/risol-aneka-rasa.svg" /><figcaption>risol</figcaption></figure>
    <figure><img src="/uploads/qris-placeholder.svg" /><figcaption>qris-placeholder</figcaption></figure>
    <figure><img src="/uploads/basket.svg" /><figcaption>basket</figcaption></figure>
    <figure><img src="/uploads/chef.svg" /><figcaption>chef</figcaption></figure>
    <figure><img src="/uploads/chef-hat.svg" /><figcaption>chef-hat</figcaption></figure>
  </body>
</html>
