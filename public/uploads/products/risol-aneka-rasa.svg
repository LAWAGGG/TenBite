  <!-- kilau minyak -->
  <g fill="#ffe3b0" opacity=".7" stroke="none">
    <ellipse cx="176" cy="248" rx="26" ry="7" transform="rotate(-6 176 248)" />
    <ellipse cx="266" cy="292" rx="20" ry="6" transform="rotate(-6 266 292)" />
  </g>

  <!-- cabai & remah -->
  <g fill="#d9322f" stroke="none">
    <path d="M300 128c12-4 20 4 17 12-3 9-17 8-21-2z" />
    <path d="M96 152c10-3 17 3 15 10-3 8-15 7-18-1z" />
